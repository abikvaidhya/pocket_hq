name: pocket_hq
description: 'Pocket HQ - Personal dashboard'
publish_to: 'none'
version: 1.0.1+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod:
  riverpod_annotation:

  # Local storage
  hive:
  hive_flutter:

  # UI & charts
  fl_chart:
  flutter_staggered_grid_view:
  google_fonts:
  flutter_animate:
  iconsax:

  # Native bridges & permissions
  local_auth:
  permission_handler: ^11.3.1

  # usage_stats:          # wrapper or pure MethodChannel
  device_calendar:       # or pure native
  geolocator:
  geocoding:

  # Notifications & background
  flutter_local_notifications:
  workmanager: ^0.10.10
  timezone: ^0.9.4

  # Utils
  intl:
  uuid:
  path_provider:
  freezed_annotation:
  json_annotation:
  collection:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  freezed: ^2.5.2
  json_serializable: ^6.8.0