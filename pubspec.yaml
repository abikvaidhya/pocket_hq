name: pocket_hq
description: 'Pocket HQ - Personal dashboard'
publish_to: 'none'
version: 1.0.4+6

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod:

  # Local storage
  hive:
  hive_flutter:

  # UI & charts
  fl_chart:
  google_fonts:
  iconsax:

  # Native bridges & permissions
  local_auth:
  permission_handler:

  geolocator:
  geocoding:

  # Notifications & background
  flutter_local_notifications:
  flutter_timezone: ^4.1.1
  workmanager:
  timezone:

  # Utils
  intl:
  uuid:
  path_provider:
  package_info_plus:

  # Speech and voice related
  record:
  just_audio:
  speech_to_text:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
